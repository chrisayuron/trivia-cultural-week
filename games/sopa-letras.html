<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sopas de Letras Mundialistas | TRIVIA MUNDIALISTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            scroll-behavior: smooth;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fadeIn { animation: fadeIn 0.6s ease-out; }
        .animate-scaleIn { animation: scaleIn 0.4s ease-out; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .sopa-card {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .sopa-card:hover {
            transform: translateY(-4px);
            border-color: #fbbf24;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .btn-back {
            background: transparent;
            border: 2px solid #475569;
            transition: all 0.15s ease;
        }
        .btn-back:hover { background: #334155; border-color: #64748b; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 min-h-screen p-4 flex items-center justify-center">

<div id="app" class="w-full max-w-6xl mx-auto"></div>

<script>
    const appContainer = document.getElementById('app');

    // Listado de todas las sopas de letras con sus metadatos
    const sopasData = [
        {
            titulo: "🧸 NIVEL PREESCOLAR",
            descripcion: "Palabras muy cortas y básicas: FÚTBOL, GOL, BALÓN, JUGADOR, MUNDIAL",
            nivel: "preescolar",
            url: "https://buscapalabras.com.ar/sopa-de-letras-de-sopa-de-letras-mundialista-t.html",
            color: "from-green-500 to-emerald-600"
        },
        {
            titulo: "📚 1 y 2",
            descripcion: "Palabras variadas relacionadas con el mundial y el futbol",
            nivel: "1-2",
            url: "https://buscapalabras.com.ar/sopa-de-letras-de-sopa-de-letras-mundialista-t-2.html",
            color: "from-emerald-500 to-green-600"
        },
        {
            titulo: "⭐ Nivel: 3° a 5° Grado",
            descripcion: "Palabras variadas relacionadas con el mundial y el futbol",
            nivel: "3-5",
            url: "https://buscapalabras.com.ar/sopa-de-letras-de-sopa-de-letras-mundialista-3-5.html",
            color: "from-blue-500 to-blue-600"
        },
        {
            titulo: "⚽ Nivel: 6° a 8° Grado",
            descripcion: "Palabras variadas relacionadas con el mundial y el futbol",
            nivel: "6-8",
            url: "https://buscapalabras.com.ar/sopa-de-letras-de-sopa-de-letras-mundialista-6-8.html",
            color: "from-amber-500 to-orange-600"
        },
        {
            titulo: "🏆 Nivel: 9° a 11° Grado",
            descripcion: "Palabras variadas relacionadas con el mundial y el futbol",
            nivel: "9-11",
            url: "https://buscapalabras.com.ar/sopa-de-letras-de-sopa-de-letras-mundialista-9-11.html",
            color: "from-purple-500 to-purple-700"
        },
        {
            titulo: "🥇 Campeones y Subcampeones",
            descripcion: "URUGUAY, ARGENTINA, BRASIL, ALEMANIA, FRANCIA, INGLATERRA, PAÍSES BAJOS...",
            nivel: "campeones",
            url: "https://buscapalabras.com.ar/sopa-de-letras-de-campeones-y-subcampeones-mundialistas.html",
            color: "from-yellow-500 to-amber-600"
        },
        {
            titulo: "🏟️ Sedes Mundialistas",
            descripcion: "URUGUAY, ITALIA, FRANCIA, BRASIL, MÉXICO, ESTADOS UNIDOS, QATAR...",
            nivel: "sedes",
            url: "https://buscapalabras.com.ar/sopa-de-letras-de-sedes-mundialistas_2.html",
            color: "from-rose-500 to-red-600"
        },
        {
            titulo: "🌟 Figuras Mundialistas (Históricas)",
            descripcion: "PELÉ, MARADONA, CRUYFF, ZIDANE, RONALDO, MESSI, MBAPPÉ...",
            nivel: "figuras",
            url: "https://buscapalabras.com.ar/sopa-de-letras-de-figuras-mundialistas.html",
            color: "from-indigo-500 to-indigo-700"
        },
        {
            titulo: "⭐ Figuras Mundial 2026",
            descripcion: "MBAPPÉ, VINÍCIUS JR, BELLINGHAM, MUSIALA, NEYMAR, LAUTARO MARTÍNEZ...",
            nivel: "figuras2026",
            url: "https://buscapalabras.com.ar/sopa-de-letras-de-figuras-mundial-2026.html",
            color: "from-teal-500 to-teal-700"
        }
    ];

    function renderMainUI() {
        appContainer.innerHTML = `
            <div class="bg-slate-800/50 backdrop-blur-sm rounded-3xl p-5 shadow-2xl border border-slate-700 animate-fadeIn">
                <!-- Header -->
                <div class="text-center mb-6">
                    <h1 class="text-3xl md:text-4xl font-black bg-gradient-to-r from-amber-400 to-yellow-500 bg-clip-text text-transparent">
                        🔍 SOPAS DE LETRAS MUNDIALISTAS ⚽
                    </h1>
                    <p class="text-slate-400 text-sm mt-1">Elige una sopa de letras según tu nivel o tema favorito</p>
                    <div class="w-24 h-1 bg-gradient-to-r from-amber-400 to-yellow-500 mx-auto mt-2 rounded-full"></div>
                </div>

                <!-- Grid de tarjetas (2 columnas en desktop, 1 en móvil) -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-5 mb-6">
                    ${sopasData.map(sopa => `
                        <div class="sopa-card bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden transition-all cursor-pointer" data-url="${sopa.url}">
                            <div class="h-2 bg-gradient-to-r ${sopa.color}"></div>
                            <div class="p-5">
                                <h3 class="text-xl font-bold text-white mb-2">${sopa.titulo}</h3>
                                <p class="text-slate-400 text-sm leading-relaxed mb-3">${sopa.descripcion}</p>
                                <div class="flex items-center justify-between">
                                    <span class="text-xs text-slate-500 bg-slate-700 px-2 py-1 rounded-full">🎮 Juego independiente</span>
                                    <span class="text-amber-400 text-sm font-semibold flex items-center gap-1">
                                        Jugar ahora →
                                    </span>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>

                <!-- Botón volver al inicio -->
                <div class="flex justify-center pt-2">
                    <button id="btnVolverHome" class="btn-back text-slate-300 font-bold py-2.5 px-6 rounded-xl text-sm transition flex items-center gap-2">
                        🏠 Volver al inicio de la trivia
                    </button>
                </div>
                
                <div class="text-center mt-6">
                    <p class="text-slate-500 text-xs">🌍 Cultural Week 2026 - Cada sopa de letras se abre en una nueva pestaña</p>
                    <p class="text-slate-600 text-xs mt-1">💡 Todos los juegos son independientes: cada estudiante juega en su propia computadora</p>
                </div>
            </div>
        `;

        // Asignar eventos a cada tarjeta para abrir el enlace en nueva pestaña
        const cards = document.querySelectorAll('.sopa-card');
        cards.forEach(card => {
            card.addEventListener('click', () => {
                const url = card.dataset.url;
                if (url) {
                    window.open(url, '_blank');
                }
            });
        });

        // Botón volver a index.html
        const btnHome = document.getElementById('btnVolverHome');
        if (btnHome) {
            btnHome.addEventListener('click', () => {
                window.location.href = 'index.html';
            });
        }
    }

    renderMainUI();
</script>
</body>
</html>
