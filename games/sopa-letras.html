<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sopa de Letras Mundialista - TRIVIA MUNDIALISTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Header del juego -->
        <div class="flex items-center justify-between mb-8">
            <a href="../index.html" class="text-white hover:text-emerald-400 transition-colors flex items-center gap-2">
                <span>←</span> Volver al Menú
            </a>
            <h1 class="text-2xl font-bold text-white">🔤 Sopa de Letras Mundialista</h1>
            <div class="text-white font-bold">
                ⏱️ <span id="timer">00:00</span>
            </div>
        </div>
        
        <!-- Área de juego -->
        <div class="bg-white/10 backdrop-blur-sm rounded-2xl p-8 text-center">
            <p class="text-white text-xl mb-4">¡Encuentra las palabras!</p>
            <div class="text-slate-300">
                🚧 Juego en desarrollo...
            </div>
            <p class="text-slate-400 mt-4">Pronto podrás jugar aquí</p>
        </div>
        
        <!-- Lista de palabras -->
        <div class="mt-8 bg-white/5 rounded-xl p-6">
            <h3 class="text-white font-bold mb-4">Palabras a encontrar:</h3>
            <div class="flex flex-wrap gap-3">
                <span class="bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full">BRASIL</span>
                <span class="bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full">GOL</span>
                <span class="bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full">MUNDIAL</span>
                <span class="bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full">FÚTBOL</span>
                <span class="bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full">PELÉ</span>
            </div>
        </div>
    </div>
</body>
</html>
