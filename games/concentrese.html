<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Concéntrese Mundialista - TRIVIA MUNDIALISTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        .card {
            perspective: 1000px;
            cursor: pointer;
            user-select: none;
            width: var(--card-width);
            height: var(--card-height);
            min-width: 0;
            transition: transform 0.1s ease;
        }
        .card:active {
            transform: scale(0.97);
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 1rem;
            box-shadow: 0 12px 28px rgba(0,0,0,0.3);
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }
        /* Lado frontal: número enorme y llamativo */
        .card-front {
            background: linear-gradient(145deg, #0a3622, #0a5c3e);
            color: #ffdd55;
            font-size: clamp(2.2rem, calc(var(--card-width, 120px) * 0.55), 4rem);
            font-weight: 900;
            text-shadow: 4px 4px 0 rgba(0,0,0,0.4);
            border: 3px solid rgba(255,221,85,0.6);
            font-family: 'Inter', monospace;
        }
        .card-back {
            background: white;
            color: #0f172a;
            transform: rotateY(180deg);
            padding: clamp(0.35rem, calc(var(--card-width, 120px) * 0.06), 1rem);
            text-align: center;
            word-break: break-word;
            overflow: hidden;
            background: linear-gradient(135deg, #fff, #f1f5f9);
            border: 2px solid #cbd5e1;
        }
        .card-back span {
            font-size: clamp(0.8rem, calc(var(--card-width, 120px) * 0.15), 1.1rem);
            font-weight: 600;
            display: block;
            line-height: 1.35;
        }
        .card-back img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 0.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        #tablero {
            align-content: center;
            justify-content: center;
            margin-bottom: 0.5rem;
        }
        .match-success {
            animation: pulseMatch 0.4s ease-in-out 2;
        }
        @keyframes pulseMatch {
            0% { transform: scale(1); box-shadow: 0 0 0 0 #4ade80; }
            50% { transform: scale(1.06); box-shadow: 0 0 0 12px rgba(74,222,128,0.5); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 #4ade80; }
        }
        .victory-overlay {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
        }
        .grid-tablero {
            display: grid;
            gap: 1rem;
            justify-content: center;
            margin: 0 auto;
            width: 100%;
        }
        @media (max-width: 640px) {
            .grid-tablero {
                gap: 0.8rem;
            }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }
        body {
            overflow: hidden;
        }
        .tablero-scroll {
            overflow-y: auto;
            overflow-x: hidden;
            flex: 1;
            min-height: 0;
            padding: 12px 6px;
        }
        /* Tarjetas enormes */
        .card-front {
            font-size: 3rem;
        }
        @media (min-width: 768px) {
            .card-front {
                font-size: 3.5rem;
            }
        }
        /* Espaciado más amplio */
        .gap-xl {
            gap: 1.25rem;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 h-screen overflow-hidden text-white font-sans flex flex-col">

            { nombre: 'Cruyff',            seleccion: 'Países Bajos',  img: '../images/jugadores/Cruyff.jpg' },

            { nombre: 'Lineker',           seleccion: 'Inglaterra',    img: '../images/jugadores/Lineker.jpg' },
            { nombre: 'Hidetoshi Nakata',  seleccion: 'Japón',         img: '../images/jugadores/HidetoshiNakata.png' },
            { nombre: 'Suárez',            seleccion: 'Uruguay',       img: '../images/jugadores/Luissuarez.jpg' },
            { nombre: 'Hugo Sánchez',      seleccion: 'México',        img: '../images/jugadores/HugoSanchez.jpg' },

        const paresCapitales = [
            { imagen: banderas['Brasil'],         texto: 'Brasilia' },
            { imagen: banderas['Inglaterra'],     texto: 'Londres' },
            { imagen: banderas['Alemania'],       texto: 'Berlín' },

            { imagen: banderas['Estados Unidos'], texto: 'Washington D.C.' },
            { imagen: banderas['Colombia'],       texto: 'Bogotá' },

        const paresIdiomas = [
            { imagen: banderas['Brasil'],         texto: 'Portugués (Brasil)' },
            { imagen: banderas['Portugal'],       texto: 'Portugués (Portugal)' },
            { imagen: banderas['España'],         texto: 'Español (España)' },

            { imagen: banderas['Argentina'],      texto: 'Español (Argentina)' },
            { imagen: banderas['Uruguay'],        texto: 'Español (Uruguay)' },
            { imagen: banderas['Francia'],        texto: 'Francés' },
            { imagen: banderas['Alemania'],       texto: 'Alemán' },
            { imagen: banderas['Japón'],          texto: 'Japonés' },
            { imagen: banderas['Italia'],         texto: 'Italiano' },
            { imagen: banderas['Países Bajos'],   texto: 'Neerlandés' },
            { imagen: banderas['Canadá'],         texto: 'Inglés y Francés' },
            { imagen: banderas['Inglaterra'],     texto: 'Inglés (Inglaterra)' },
            { imagen: banderas['Estados Unidos'], texto: 'Inglés (EE.UU.)' }
        ];

        const paresMonumentos = [
            { imagen: monumentos['Torre Eiffel'],           texto: 'Francia' },
            { imagen: monumentos['Big Ben'],                texto: 'Inglaterra' },
            { imagen: monumentos['Cristo Redentor'],        texto: 'Brasil' },
            { imagen: monumentos['Monte Fuji'],             texto: 'Japón' },
            { imagen: monumentos['Estatua de la Libertad'], texto: 'Estados Unidos' },
            { imagen: monumentos['Coliseo Romano'],         texto: 'Italia' },
            { imagen: monumentos['Taj Mahal'],              texto: 'India' },
            { imagen: monumentos['Machu Picchu'],           texto: 'Perú' },
            { imagen: monumentos['Torre de Pisa'],          texto: 'Italia (Pisa)' },
            { imagen: monumentos['Pirámides de Giza'],      texto: 'Egipto' },
            { imagen: monumentos['Ópera de Sídney'],        texto: 'Australia' },
            { imagen: monumentos['Catedral de San Basilio'],texto: 'Rusia' },
            { imagen: monumentos['Puerta de Brandeburgo'],  texto: 'Alemania' },
            { imagen: monumentos['Sagrada Familia'],        texto: 'España' },
            { imagen: monumentos['Monte Rushmore'],         texto: 'Estados Unidos (Dakota)' }
        ];

        const paresGastronomia = [
            { imagen: comidas['Sushi'],          texto: 'Japón' },
            { imagen: comidas['Pizza'],          texto: 'Italia' },
            { imagen: comidas['Tacos'],          texto: 'México' },
            { imagen: comidas['Poutine'],        texto: 'Canadá' },
            { imagen: comidas['Bratwurst'],      texto: 'Alemania' },
            { imagen: comidas['Paella'],         texto: 'España' },
            { imagen: comidas['Hamburguesa'],    texto: 'Estados Unidos' },
            { imagen: comidas['Croissant'],      texto: 'Francia' },
            { imagen: comidas['Ceviche'],        texto: 'Perú' },
            { imagen: comidas['Fish and Chips'], texto: 'Inglaterra' },
            { imagen: comidas['Arepas'],         texto: 'Colombia' },
            { imagen: comidas['Kimchi'],         texto: 'Corea del Sur' },
            { imagen: comidas['Falafel'],        texto: 'Líbano' },
            { imagen: comidas['Borscht'],        texto: 'Rusia' },
            { imagen: comidas['Pad Thai'],       texto: 'Tailandia' }
        ];

        const paresFutbol = jugadores.map(j => ({
            imagen: j.img,
            texto:  j.seleccion
        }));

        // ============ ESTADO GLOBAL ============
        let nivelSeleccionado = null;
        let categoriaSeleccionada = null;
        let dificultadSeleccionada = null;
        let cartas = [];
        let cartasSeleccionadas = [];
        let movimientos = 0;
        let tiempoInicio = null;
        let timerInterval = null;
        let juegoTerminado = false;
        let parejasEncontradas = 0;
        const paresPorDificultad = { 'facil': 3, 'medio': 6, 'dificil': 10, 'experto': 15 };
        let resizeTableroTimeout = null;

        const appContainer = document.getElementById('app');

        function barajar(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Números en orden ascendente (1,2,3... según orden del array)
        function asignarNumerosEnOrden(cartasArray) {
            return cartasArray.map((_, idx) => idx + 1);
        }

        // ============ OBTENER FUENTES Y GENERACIÓN DE PARES ============
        function obtenerFuenteImagenes(categoria) {
            if (categoria === 'banderas' || categoria === 'paises') return banderas;
            if (categoria === 'monumentos') return monumentos;
            if (categoria === 'animales') return animales;
            if (categoria === 'comidas' || categoria === 'gastronomia') return comidas;
            if (categoria === 'futbol') {
                const obj = {};
                jugadores.forEach(j => { obj[j.nombre] = j.img; });
                return obj;
            }
            return banderas;
        }

        function generarParesImagenIdentica(categoria, num) {
            const fuente = obtenerFuenteImagenes(categoria);
            const claves = Object.keys(fuente);
            const n = Math.min(num, claves.length);
            return claves.slice(0, n).map(clave => ({
                tipo: 'imagen',
                contenido: fuente[clave],
                texto: clave
            }));
        }

        function generarParesImagenNombre(categoria, num) {
            const fuente = obtenerFuenteImagenes(categoria);
            const claves = Object.keys(fuente);
            const n = Math.min(num, claves.length);
            return claves.slice(0, n).map(clave => ({
                tipo: 'par',
                imagen: fuente[clave],
                texto: clave
            }));
        }

        function generarParesConceptuales(categoria, num) {
            let fuente = [];
            if      (categoria === 'capitales')   fuente = paresCapitales;
            else if (categoria === 'idiomas')      fuente = paresIdiomas;
            else if (categoria === 'monumentos')   fuente = paresMonumentos;
            else if (categoria === 'gastronomia')  fuente = paresGastronomia;
            else if (categoria === 'futbol')       fuente = paresFutbol;
            return fuente.slice(0, num).map(p => ({
                tipo:   'par',
                imagen: p.imagen,
                texto:  p.texto
            }));
        }

        function generarCartas() {
            const numPares = paresPorDificultad[dificultadSeleccionada];
            let items = [];
            if (nivelSeleccionado === 'preescolar') {
                items = generarParesImagenIdentica(categoriaSeleccionada, numPares);
                const mazo = duplicarYMezclar(items.map(item => ({ ...item, rol: 'imagen' })), true);
                return mazo;
            } else if (nivelSeleccionado === 'primaria') {
                items = generarParesImagenNombre(categoriaSeleccionada, numPares);
                const pares = [];
                items.forEach((item, i) => {
                    pares.push({ ...item, rol: 'imagen', _parId: i });
                    pares.push({ ...item, rol: 'texto', _parId: i });
                });
                return barajar(pares);
            } else if (nivelSeleccionado === 'secundaria') {
                items = generarParesConceptuales(categoriaSeleccionada, numPares);
                const pares = [];
                items.forEach((item, i) => {
                    pares.push({ ...item, rol: 'imagen', _parId: i });
                    pares.push({ ...item, rol: 'texto', _parId: i });
                });
                return barajar(pares);
            }
            return [];
        }

        function duplicarYMezclar(arr, identico = false) {
            const duplicado = [];
            arr.forEach((item, i) => {
                duplicado.push({ ...item, _parId: i });
                duplicado.push({ ...item, _parId: i });
            });
            return barajar(duplicado);
        }

        // ============ LÓGICA DE JUEGO ============
        function iniciarJuego(dificultad) {
            dificultadSeleccionada = dificultad;
            cartas = generarCartas();
            const numerosFrontales = asignarNumerosEnOrden(cartas);
            
            cartasSeleccionadas = [];
            movimientos = 0;
            parejasEncontradas = 0;
            juegoTerminado = false;
            if (timerInterval) clearInterval(timerInterval);
            tiempoInicio = Date.now();
            appContainer.className = 'flex-1 flex flex-col w-full overflow-hidden';
            renderizarTablero(numerosFrontales);
            iniciarCronometro();
        }

        function renderizarContenidoCarta(carta) {
            if (carta.tipo === 'imagen' || carta.rol === 'imagen') {
                const imgSrc = carta.contenido || carta.imagen;
                return `<img src="${imgSrc}" alt="imagen" class="max-w-full max-h-full object-contain rounded" style="max-height: 100%; max-width: 100%;">`;
            } else if (carta.rol === 'texto') {
                return `<span class="text-sm md:text-base font-semibold leading-tight p-1 break-words">${carta.texto}</span>`;
            }
            return '';
        }

        function renderizarTablero(numerosFrontales) {
            const totalPares = paresPorDificultad[dificultadSeleccionada];
            const totalCartas = totalPares * 2;
            let columnas;
            if (totalPares <= 3) columnas = 3;
            else if (totalPares <= 6) columnas = 4;
            else if (totalPares <= 10) columnas = 5;
            else columnas = 6;
            const columnasMobile = Math.min(columnas, totalPares <= 6 ? 3 : 4);
            const columnasFinal = window.innerWidth < 768 ? columnasMobile : columnas;

            let cartasHTML = '';
            cartas.forEach((carta, idx) => {
                const numeroMostrar = numerosFrontales[idx];
                cartasHTML += `
                    <div class="card" onclick="voltearCarta(${idx})" data-index="${idx}">
                        <div class="card-inner">
                            <div class="card-front flex items-center justify-center font-black">
                                ${numeroMostrar}
                            </div>
                            <div class="card-back flex items-center justify-center p-2 md:p-3">
                                ${renderizarContenidoCarta(carta)}
                            </div>
                        </div>
                    </div>
                `;
            });

            appContainer.innerHTML = `
                <div class="flex justify-between items-center gap-2 mb-3 px-1 flex-shrink-0">
                    <button onclick="mostrarSelectorNivel()" class="bg-slate-700/80 hover:bg-slate-600 text-white text-xs md:text-sm px-4 py-2 rounded-full transition shadow-md">← Salir</button>
                    <div class="flex flex-wrap justify-end gap-2 md:gap-3 text-xs md:text-sm">
                        <span class="bg-slate-700 px-3 py-1.5 rounded-full font-mono shadow">⏱️ <span id="timer">00:00</span></span>
                        <span class="bg-slate-700 px-3 py-1.5 rounded-full font-mono shadow">👆 <span id="movimientos">0</span></span>
                        <span class="bg-slate-700 px-3 py-1.5 rounded-full font-mono shadow">✅ <span id="puntaje">0/${totalPares}</span></span>
                    </div>
                </div>
                <div class="tablero-scroll w-full flex justify-center">
                    <div id="tablero" class="grid-tablero" style="grid-template-columns: repeat(${columnasFinal}, minmax(0, auto));">
                        ${cartasHTML}
                    </div>
                </div>
            `;
            
            setTimeout(() => {
                ajustarTamanoTableroManual();
            }, 30);
        }

        // TARJETAS MÁS GRANDES: aumentamos el tamaño mínimo y máximo
        function ajustarTamanoTableroManual() {
            const tablero = document.getElementById('tablero');
            if (!tablero || !dificultadSeleccionada) return;
            
            const totalPares = paresPorDificultad[dificultadSeleccionada];
            const totalCartas = totalPares * 2;
            const computedStyles = window.getComputedStyle(tablero);
            const columnasTexto = computedStyles.gridTemplateColumns;
            const columnas = columnasTexto.split(' ').length;
            
            if (columnas === 0) return;
            
            const filas = Math.ceil(totalCartas / columnas);
            const espacio = window.innerWidth >= 768 ? 18 : 12;
            const anchoDisponible = tablero.parentElement.clientWidth - 24;
            const altoDisponible = Math.min(window.innerHeight * 0.7, 700);
            
            // Tarjetas más grandes: relación más cercana a cuadrada (0.9 para que sean anchas y altas)
            const proporcion = 0.9;
            
            const anchoPorColumna = (anchoDisponible - espacio * (columnas - 1)) / columnas;
            const altoPorFila = (altoDisponible - espacio * (filas - 1)) / filas;
            
            // Tamaño mínimo aumentado a 95px, máximo a 190px
            let anchoCarta = Math.max(95, Math.min(anchoPorColumna, altoPorFila / proporcion));
            let altoCarta = anchoCarta * proporcion;
            
            anchoCarta = Math.min(anchoCarta, 190);
            altoCarta = anchoCarta * proporcion;
            
            tablero.style.gap = `${espacio}px`;
            tablero.style.justifyContent = 'center';
            
            const cartasDom = document.querySelectorAll('.card');
            cartasDom.forEach(card => {
                card.style.setProperty('--card-width', `${anchoCarta}px`);
                card.style.setProperty('--card-height', `${altoCarta}px`);
            });
        }

        function voltearCarta(index) {
            if (juegoTerminado) return;
            const cartaEl = document.querySelector(`.card[data-index="${index}"]`);
            if (!cartaEl || cartaEl.classList.contains('flipped')) return;
            if (cartasSeleccionadas.length === 2) return;

            cartaEl.classList.add('flipped');
            cartasSeleccionadas.push({ index, carta: cartas[index] });

            if (cartasSeleccionadas.length === 2) {
                movimientos++;
                const movEl = document.getElementById('movimientos');
                if (movEl) movEl.textContent = movimientos;
                verificarPareja();
            }
        }

        function verificarPareja() {
            const [primera, segunda] = cartasSeleccionadas;
            const carta1 = primera.carta;
            const carta2 = segunda.carta;
            let esPareja = false;
            if (nivelSeleccionado === 'preescolar') {
                esPareja = (carta1._parId === carta2._parId) && (primera.index !== segunda.index);
            } else {
                esPareja = (carta1._parId === carta2._parId) && (carta1.rol !== carta2.rol) && (primera.index !== segunda.index);
            }

            if (esPareja) {
                parejasEncontradas++;
                const puntajeSpan = document.getElementById('puntaje');
                if (puntajeSpan) puntajeSpan.textContent = `${parejasEncontradas}/${paresPorDificultad[dificultadSeleccionada]}`;
                const el1 = document.querySelector(`.card[data-index="${primera.index}"]`);
                const el2 = document.querySelector(`.card[data-index="${segunda.index}"]`);
                if (el1) el1.classList.add('match-success');
                if (el2) el2.classList.add('match-success');
                cartasSeleccionadas = [];
                if (parejasEncontradas === paresPorDificultad[dificultadSeleccionada]) {
                    juegoGanado();
                }
            } else {
                setTimeout(() => {
                    const el1 = document.querySelector(`.card[data-index="${primera.index}"]`);
                    const el2 = document.querySelector(`.card[data-index="${segunda.index}"]`);
                    if (el1) el1.classList.remove('flipped');
                    if (el2) el2.classList.remove('flipped');
                    cartasSeleccionadas = [];
                }, 800);
            }
        }

        function calcularPuntuacion(movs, tiempo) {
            const base = 1000;
            const penalizacion = movs * 5 + Math.floor(tiempo / 10);
            return Math.max(base - penalizacion, 100);
        }

        function guardarProgreso(puntuacion, tiempo) {
            const key = `concentrese_${nivelSeleccionado}_${categoriaSeleccionada}_${dificultadSeleccionada}`;
            const datos = JSON.parse(localStorage.getItem(key) || '{}');
            if (!datos.mejorPuntuacion || puntuacion > datos.mejorPuntuacion) datos.mejorPuntuacion = puntuacion;
            if (!datos.mejorTiempo || tiempo < datos.mejorTiempo) datos.mejorTiempo = tiempo;
            datos.partidasCompletadas = (datos.partidasCompletadas || 0) + 1;
            localStorage.setItem(key, JSON.stringify(datos));
        }

        function juegoGanado() {
            juegoTerminado = true;
            clearInterval(timerInterval);
            const tiempoTotal = Math.floor((Date.now() - tiempoInicio) / 1000);
            const minutos = Math.floor(tiempoTotal / 60).toString().padStart(2, '0');
            const segundos = (tiempoTotal % 60).toString().padStart(2, '0');
            const puntuacion = calcularPuntuacion(movimientos, tiempoTotal);
            guardarProgreso(puntuacion, tiempoTotal);

            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 victory-overlay flex items-center justify-center z-50';
            overlay.innerHTML = `
                <div class="bg-slate-800 rounded-2xl p-6 max-w-sm w-full mx-4 text-center shadow-2xl">
                    <div class="text-5xl mb-3">🏆</div>
                    <h2 class="text-2xl font-bold text-white mb-1">¡Felicitaciones!</h2>
                    <p class="text-slate-300 mb-4 text-sm">Completaste el concentrese</p>
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div class="bg-slate-700 p-3 rounded-xl"><p class="text-xs">Movimientos</p><p class="text-lg font-bold">${movimientos}</p></div>
                        <div class="bg-slate-700 p-3 rounded-xl"><p class="text-xs">Tiempo</p><p class="text-lg font-bold">${minutos}:${segundos}</p></div>
                    </div>
                    <p class="text-amber-400 font-bold text-xl mb-4">⭐ Puntuación: ${puntuacion}</p>
                    <button id="btnJugarOtraVez" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 px-4 rounded-xl w-full mb-2">Jugar otra vez</button>
                    <button id="btnCambiarNivel" class="bg-slate-600 hover:bg-slate-700 text-white font-bold py-2.5 px-4 rounded-xl w-full">Cambiar nivel</button>
                </div>
            `;
            document.body.appendChild(overlay);
            document.getElementById('btnJugarOtraVez').onclick = () => { overlay.remove(); iniciarJuego(dificultadSeleccionada); };
            document.getElementById('btnCambiarNivel').onclick = () => { overlay.remove(); mostrarSelectorNivel(); };
        }

        function iniciarCronometro() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (juegoTerminado) return;
                const diff = Math.floor((Date.now() - tiempoInicio) / 1000);
                const mins = Math.floor(diff / 60).toString().padStart(2, '0');
                const segs = (diff % 60).toString().padStart(2, '0');
                const timerSpan = document.getElementById('timer');
                if (timerSpan) timerSpan.textContent = `${mins}:${segs}`;
            }, 1000);
        }

        // ============ NAVEGACIÓN INICIAL ============
        function mostrarSelectorNivel() {
            appContainer.className = 'flex-1 flex items-center justify-center px-4';
            appContainer.innerHTML = `
                <div class="text-center animate-fadeIn w-full">
                    <a href="../index.html" class="inline-block mb-4 text-slate-400 hover:text-white transition text-sm">← Volver al Menú</a>
                    <h1 class="text-3xl md:text-4xl font-black text-white mb-3">🧠 Concéntrese Mundialista</h1>
                    <p class="text-slate-300 mb-6 text-sm">Selecciona tu nivel educativo</p>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 max-w-3xl mx-auto">
                        <button onclick="seleccionarNivel('preescolar')" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl text-lg shadow-lg transition">🧒 Preescolar</button>
                        <button onclick="seleccionarNivel('primaria')" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 rounded-xl text-lg shadow-lg transition">👦 Primaria</button>
                        <button onclick="seleccionarNivel('secundaria')" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-4 rounded-xl text-lg shadow-lg transition">🧑 Secundaria</button>
                    </div>
                </div>
            `;
        }

        function seleccionarNivel(nivel) {
            nivelSeleccionado = nivel;
            const categorias = (nivel === 'preescolar') ? [
                { id: 'banderas', nombre: 'Banderas', icono: '🏳️' }, { id: 'monumentos', nombre: 'Monumentos', icono: '🏛️' },
                { id: 'animales', nombre: 'Animales', icono: '🐾' }, { id: 'comidas', nombre: 'Comidas', icono: '🍽️' }
            ] : (nivel === 'primaria') ? [
                { id: 'paises', nombre: 'Países', icono: '🌍' }, { id: 'monumentos', nombre: 'Monumentos', icono: '🏰' },
                { id: 'animales', nombre: 'Animales', icono: '🦁' }, { id: 'comidas', nombre: 'Comidas', icono: '🍕' }
            ] : [
                { id: 'capitales', nombre: 'Capitales', icono: '🏙️' }, { id: 'idiomas', nombre: 'Idiomas', icono: '🗣️' },
                { id: 'monumentos', nombre: 'Monumentos ↔ País', icono: '🗽' }, { id: 'gastronomia', nombre: 'Gastronomía ↔ País', icono: '🍜' },
                { id: 'futbol', nombre: 'Fútbol', icono: '⚽' }
            ];
            appContainer.innerHTML = `
                <div class="text-center animate-fadeIn w-full">
                    <button onclick="mostrarSelectorNivel()" class="text-slate-400 hover:text-white mb-3 inline-block text-sm">← Cambiar nivel</button>
                    <h2 class="text-2xl font-bold text-white mb-2">Elige una categoría</h2>
                    <p class="text-slate-400 mb-4 text-sm">Nivel: ${nivel.charAt(0).toUpperCase() + nivel.slice(1)}</p>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-2 max-w-xl mx-auto">
                        ${categorias.map(cat => `<button onclick="seleccionarCategoria('${cat.id}')" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 px-4 rounded-xl transition text-sm">${cat.icono} ${cat.nombre}</button>`).join('')}
                    </div>
                </div>
            `;
        }

        function seleccionarCategoria(categoriaId) {
            categoriaSeleccionada = categoriaId;
            appContainer.innerHTML = `
                <div class="text-center animate-fadeIn w-full">
                    <button onclick="seleccionarNivel('${nivelSeleccionado}')" class="text-slate-400 hover:text-white mb-3 inline-block text-sm">← Cambiar categoría</button>
                    <h2 class="text-2xl font-bold text-white mb-2">Dificultad</h2>
                    <p class="text-slate-400 mb-4 text-sm">Categoría: ${categoriaId}</p>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 max-w-lg mx-auto">
                        <button onclick="iniciarJuego('facil')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl">Fácil (3 pares)</button>
                        <button onclick="iniciarJuego('medio')" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 rounded-xl">Medio (6 pares)</button>
                        <button onclick="iniciarJuego('dificil')" class="bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-xl">Difícil (10 pares)</button>
                        <button onclick="iniciarJuego('experto')" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl">Experto (15 pares)</button>
                    </div>
                </div>
            `;
        }

        window.addEventListener('resize', () => {
            clearTimeout(resizeTableroTimeout);
            resizeTableroTimeout = setTimeout(() => {
                if (document.getElementById('tablero')) ajustarTamanoTableroManual();
            }, 100);
        });
        
        mostrarSelectorNivel();
    </script>
</body>
</html>
