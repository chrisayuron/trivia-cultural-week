<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Crucigramas Mundialistas | TRIVIA MUNDIALISTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            scroll-behavior: smooth;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fadeIn { animation: fadeIn 0.6s ease-out; }
        .animate-scaleIn { animation: scaleIn 0.4s ease-out; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .crossword-card {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .crossword-card:hover {
            transform: translateY(-4px);
            border-color: #fbbf24;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .btn-back {
            background: transparent;
            border: 2px solid #475569;
            transition: all 0.15s ease;
        }
        .btn-back:hover { background: #334155; border-color: #64748b; }
        
        .embed-preview {
            background: #0f172a;
            border-radius: 12px;
            padding: 0.5rem;
            margin-top: 0.75rem;
        }
        .embed-preview iframe {
            width: 100%;
            height: 300px;
            border-radius: 8px;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 min-h-screen p-4 flex items-center justify-center">

<div id="app" class="w-full max-w-6xl mx-auto"></div>

<script>
    const appContainer = document.getElementById('app');

    // Listado de todos los crucigramas con sus metadatos
    const crucigramasData = [
        {
            titulo: "🧸 NIVEL PREESCOLAR",
            descripcion: "Crucigrama con palabras muy básicas: BOTA, ESTADIO, GOL, COPA, PORTERÍA.",
            nivel: "preescolar",
            url: "https://crosswordlabs.com/embed/crucigrama-mundialista-t",
            color: "from-green-500 to-emerald-600",
            palabras: "bota, estadio, gol, copa, portería"
        },
        {
            titulo: "📚 1 y 2",
            descripcion: "Primer acercamiento a los crucigramas. Palabras: ESTADIO, EQUIPO, PASE, PIE, GOL, AFICIÓN, BALÓN, PORTERÍA, MUNDIAL, COPA.",
            nivel: "1-2",
            url: "https://crosswordlabs.com/embed/crucigrama-mundialista-1-2",
            color: "from-emerald-500 to-green-600",
            palabras: "estadio, equipo, pase, pie, gol, afición, balón, portería, mundial, copa"
        },
        {
            titulo: "⭐ 3° a 5° Grado",
            descripcion: "Crucigrama con términos como: AFICIÓN, FINAL, PENAL, CAPITÁN, ESTADIO, BALÓN, SELECCIÓN, COPA, ÁRBITRO, BANDERA, GOL, CANCHA, ARQUERO, HIMNO, PASE.",
            nivel: "3-5",
            url: "https://crosswordlabs.com/embed/crucigrama-mundialista-3-5",
            color: "from-blue-500 to-blue-600",
            palabras: "afición, final, penal, capitán, estadio, balón, selección, copa, árbitro, bandera, gol, cancha, arquero, himno, pase"
        },
        {
            titulo: "⚽ 6° a 8° Grado",
            descripcion: "Desafío de tamaño medio. Incluye: ELIMINATORIAS, ARQUERO, DEFENSOR, MEDIOCAMPO, BANDERA, VICTORIA, ELIMINACIÓN, HIMNO, AFICIÓN, TROFEO, PENAL, ESTADIO, DERROTA, SELECCIÓN, EMPATE, JUGADOR, FINAL, DELANTERO, GRUPOS, ÁRBITRO.",
            nivel: "6-8",
            url: "https://crosswordlabs.com/embed/crucigrama-mundialista-6-8",
            color: "from-amber-500 to-orange-600",
            palabras: "eliminatorias, arquero, defensor, mediocampo, bandera, victoria, eliminación, himno, afición, trofeo, penal, estadio, derrota, selección, empate, jugador, final, delantero, grupos, árbitro"
        },
        {
            titulo: "🏆 9° a 11° Grado",
            descripcion: "Crucigrama avanzado con términos complejos: SEMIFINAL, CAMPEÓN, COPA, ESTADIO, ELIMINACIÓN, ARQUERO, ÁRBITRO, PENAL, AFICIÓN, GRUPOS, ELIMINATORIAS, VOLANTE, SELECCIÓN, CUARTOS, MUNDIAL, SUBCAMPEÓN, OCTAVOS, BANDERA, GOLEADOR, DELANTERO, PORTERO, JUGADOR, VAR, FINAL, HIMNO.",
            nivel: "9-11",
            url: "https://crosswordlabs.com/embed/crucigrama-mundialista-9-11",
            color: "from-purple-500 to-purple-700",
            palabras: "semifinal, campeón, copa, estadio, eliminación, arquero, árbitro, penal, afición, grupos, eliminatorias, volante, selección, cuartos, mundial, subcampeón, octavos, bandera, goleador, delantero, portero, jugador, var, final, himno"
        }
    ];

    function renderMainUI() {
        appContainer.innerHTML = `
            <div class="bg-slate-800/50 backdrop-blur-sm rounded-3xl p-5 shadow-2xl border border-slate-700 animate-fadeIn">
                <!-- Header -->
                <div class="text-center mb-6">
                    <h1 class="text-3xl md:text-4xl font-black bg-gradient-to-r from-amber-400 to-yellow-500 bg-clip-text text-transparent">
                        📝 CRUCIGRAMAS MUNDIALISTAS ⚽
                    </h1>
                    <p class="text-slate-400 text-sm mt-1">Elige un crucigrama según tu nivel educativo</p>
                    <div class="w-24 h-1 bg-gradient-to-r from-amber-400 to-yellow-500 mx-auto mt-2 rounded-full"></div>
                </div>

                <!-- Grid de tarjetas (2 columnas en desktop, 1 en móvil) -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-5 mb-6">
                    ${crucigramasData.map(crucigrama => `
                        <div class="crossword-card bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden transition-all cursor-pointer" data-url="${crucigrama.url}">
                            <div class="h-2 bg-gradient-to-r ${crucigrama.color}"></div>
                            <div class="p-5">
                                <h3 class="text-xl font-bold text-white mb-2">${crucigrama.titulo}</h3>
                                <p class="text-slate-400 text-sm leading-relaxed mb-3">${crucigrama.descripcion}</p>
                                
                                <!-- Vista previa del crucigrama -->
                                <div class="embed-preview">
                                    <iframe src="${crucigrama.url}" title="${crucigrama.titulo}" frameborder="0" loading="lazy"></iframe>
                                </div>
                                
                                <div class="flex items-center justify-between mt-3">
                                    <span class="text-xs text-slate-500 bg-slate-700 px-2 py-1 rounded-full">📋 ${crucigrama.palabras.split(',').length} palabras</span>
                                    <span class="text-amber-400 text-sm font-semibold flex items-center gap-1">
                                        Jugar ahora →
                                    </span>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>

                <!-- Botón volver al inicio -->
                <div class="flex justify-center pt-2">
                    <button id="btnVolverHome" class="btn-back text-slate-300 font-bold py-2.5 px-6 rounded-xl text-sm transition flex items-center gap-2">
                        🏠 Volver al inicio de la trivia
                    </button>
                </div>
                
                <div class="text-center mt-6">
                    <p class="text-slate-500 text-xs">🌍 Cultural Week 2026 - Cada crucigrama se abre en una nueva pestaña</p>
                    <p class="text-slate-600 text-xs mt-1">💡 Todos los juegos son independientes: cada estudiante juega en su propia computadora</p>
                </div>
            </div>
        `;

        // Asignar eventos a cada tarjeta para abrir el enlace en nueva pestaña
        const cards = document.querySelectorAll('.crossword-card');
        cards.forEach(card => {
            card.addEventListener('click', (e) => {
                // Evitar que si el click es en el iframe se dispare dos veces
                if (e.target.tagName === 'IFRAME') return;
                const url = card.dataset.url;
                if (url) {
                    window.open(url, '_blank');
                }
            });
        });

        // Botón volver a index.html
        const btnHome = document.getElementById('btnVolverHome');
        if (btnHome) {
            btnHome.addEventListener('click', () => {
                window.location.href = 'index.html';
            });
        }
    }

    renderMainUI();
</script>
</body>
</html>
