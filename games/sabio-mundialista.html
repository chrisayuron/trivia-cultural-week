<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabio Mundialista - TRIVIA MUNDIALISTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            transform: scale(1.02);
        }
        .correct {
            background-color: #10b981 !important;
            color: white !important;
        }
        .incorrect {
            background-color: #ef4444 !important;
            color: white !important;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 min-h-screen">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <!-- Header del juego -->
        <div class="flex items-center justify-between mb-8">
            <a href="../index.html" class="text-white hover:text-emerald-400 transition-colors flex items-center gap-2">
                <span>←</span> Volver al Menú
            </a>
            <h1 class="text-2xl font-bold text-white">🧠 Sabio Mundialista</h1>
            <div class="text-white font-bold">
                ⏱️ <span id="timer">00:00</span>
            </div>
        </div>

        <!-- Progreso -->
        <div class="flex items-center gap-2 mb-6">
            <span class="text-slate-400 text-sm">Pregunta</span>
            <span id="currentQuestion" class="text-white font-bold">1</span>
            <span class="text-slate-400 text-sm">de</span>
            <span id="totalQuestions" class="text-white font-bold">10</span>
            <div class="flex-1 ml-4 bg-slate-700 rounded-full h-2">
                <div id="progressBar" class="bg-emerald-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- Puntuación -->
        <div class="text-center mb-4">
            <span class="text-slate-400">Puntuación: </span>
            <span id="score" class="text-amber-400 font-bold text-xl">0</span>
        </div>

        <!-- Área del juego -->
        <div class="bg-white/10 backdrop-blur-sm rounded-2xl p-8 mb-6">
            <!-- Pregunta -->
            <h2 id="questionText" class="text-white text-xl font-bold mb-8 text-center">
                Cargando pregunta...
            </h2>

            <!-- Opciones -->
            <div id="optionsContainer" class="grid grid-cols-1 gap-4">
                <!-- Las opciones se generan dinámicamente -->
            </div>
        </div>

        <!-- Botón siguiente -->
        <div class="text-center">
            <button id="nextButton" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all duration-200 hidden">
                Siguiente Pregunta →
            </button>
        </div>

        <!-- Resultado final -->
        <div id="finalResult" class="bg-white/10 backdrop-blur-sm rounded-2xl p-8 text-center hidden">
            <h2 class="text-3xl font-bold text-white mb-4">¡Juego terminado!</h2>
            <p class="text-xl text-slate-300 mb-2">Tu puntuación final:</p>
            <p id="finalScore" class="text-5xl font-black text-amber-400 mb-6">0</p>
            <button onclick="location.reload()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all duration-200">
                Jugar de nuevo
            </button>
            <a href="../index.html" class="inline-block mt-4 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-8 rounded-xl transition-all duration-200">
                Volver al Menú
            </a>
        </div>
    </div>

    <script>
        // Banco de preguntas (ejemplo con 10 preguntas)
        const questions = [
            {
                question: '¿Qué país ha ganado más Copas del Mundo?',
                options: ['Alemania', 'Argentina', 'Brasil', 'Italia'],
                correct: 2
            },
            {
                question: '¿En qué año se celebró el primer Mundial de Fútbol?',
                options: ['1920', '1930', '1940', '1950'],
                correct: 1
            },
            {
                question: '¿Quién es conocido como "La Mano de Dios"?',
                options: ['Pelé', 'Maradona', 'Zidane', 'Messi'],
                correct: 1
            },
            {
                question: '¿Qué país organizó el Mundial de 2022?',
                options: ['Rusia', 'Brasil', 'Catar', 'Francia'],
                correct: 2
            },
            {
                question: '¿Cuál es el estadio de fútbol más grande del mundo?',
                options: ['Wembley', 'Maracaná', 'Camp Nou', 'Rungrado 1º de Mayo'],
                correct: 3
            },
            {
                question: '¿Qué selección es apodada "La Roja"?',
                options: ['España', 'Portugal', 'Chile', 'Bélgica'],
                correct: 0
            },
            {
                question: '¿Quién es el máximo goleador en la historia de los mundiales?',
                options: ['Pelé', 'Ronaldo', 'Miroslav Klose', 'Just Fontaine'],
                correct: 2
            },
            {
                question: '¿Qué continente no ha organizado nunca un Mundial?',
                options: ['África', 'Asia', 'Oceanía', 'Antártida'],
                correct: 2
            },
            {
                question: '¿En qué país se juega el fútbol con más pasión según su cultura?',
                options: ['Brasil', 'Argentina', 'Inglaterra', 'Todos'],
                correct: 3
            },
            {
                question: '¿Qué significa el término "gol olímpico"?',
                options: [
                    'Gol marcado en tiempo extra',
                    'Gol desde el saque de esquina',
                    'Gol de penal',
                    'Gol en propia meta'
                ],
                correct: 1
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let timerInterval;
        let timeElapsed = 0;
        let gameActive = true;

        // Elementos del DOM
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const nextButton = document.getElementById('nextButton');
        const scoreDisplay = document.getElementById('score');
        const currentQSpan = document.getElementById('currentQuestion');
        const totalQSpan = document.getElementById('totalQuestions');
        const progressBar = document.getElementById('progressBar');
        const timerDisplay = document.getElementById('timer');
        const finalResult = document.getElementById('finalResult');
        const finalScore = document.getElementById('finalScore');

        // Inicializar
        totalQSpan.textContent = questions.length;
        startTimer();
        showQuestion();

        function startTimer() {
            timerInterval = setInterval(() => {
                if (gameActive) {
                    timeElapsed++;
                    const minutes = Math.floor(timeElapsed / 60).toString().padStart(2, '0');
                    const seconds = (timeElapsed % 60).toString().padStart(2, '0');
                    timerDisplay.textContent = `${minutes}:${seconds}`;
                }
            }, 1000);
        }

        function showQuestion() {
            if (currentQuestionIndex >= questions.length) {
                endGame();
                return;
            }

            gameActive = true;
            const q = questions[currentQuestionIndex];
            questionText.textContent = q.question;
            currentQSpan.textContent = currentQuestionIndex + 1;
            progressBar.style.width = ((currentQuestionIndex / questions.length) * 100) + '%';

            optionsContainer.innerHTML = '';
            nextButton.classList.add('hidden');

            q.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn bg-slate-700 hover:bg-slate-600 text-white font-semibold py-4 px-6 rounded-xl text-left transition-all duration-200';
                button.textContent = option;
                button.onclick = () => selectOption(index, q.correct);
                optionsContainer.appendChild(button);
            });
        }

        function selectOption(selectedIndex, correctIndex) {
            if (!gameActive) return;
            gameActive = false;

            const buttons = optionsContainer.querySelectorAll('button');
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === correctIndex) {
                    btn.classList.add('correct');
                } else if (idx === selectedIndex && idx !== correctIndex) {
                    btn.classList.add('incorrect');
                }
            });

            if (selectedIndex === correctIndex) {
                score += 10;
                scoreDisplay.textContent = score;
            }

            nextButton.classList.remove('hidden');
            if (currentQuestionIndex === questions.length - 1) {
                nextButton.textContent = 'Ver Resultados 🏆';
            }
        }

        nextButton.onclick = () => {
            currentQuestionIndex++;
            showQuestion();
        };

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            document.querySelector('.bg-white\\/10').classList.add('hidden');
            nextButton.classList.add('hidden');
            document.querySelector('.flex.items-center.gap-2.mb-6').classList.add('hidden');
            finalResult.classList.remove('hidden');
            finalScore.textContent = score + ' puntos';
        }
    </script>
</body>
</html>
