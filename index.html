<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIVIA MUNDIALISTA – Cultural Week 2026</title>
    
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuración de Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    animation: {
                        'bounce-slow': 'bounce 2s infinite',
                        'pulse-slow': 'pulse 3s infinite',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen">
    
    <!-- Header Fijo -->
    <header class="fixed top-0 w-full z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-700/50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="#" onclick="navigateTo('home')" class="flex items-center gap-3 hover:scale-105 transition-transform">
                <span class="text-3xl">⚽</span>
                <div>
                    <h1 class="text-white font-bold text-lg leading-tight">TRIVIA MUNDIALISTA</h1>
                    <p class="text-emerald-400 text-xs">Cultural Week</p>
                </div>
            </a>
            <nav class="hidden md:flex gap-6">
                <a href="#" onclick="navigateTo('home')" class="text-slate-300 hover:text-white transition-colors font-medium">Inicio</a>
                <a href="#juegos" class="text-slate-300 hover:text-white transition-colors font-medium">Juegos</a>
            </nav>
            <button class="md:hidden text-white text-2xl" onclick="toggleMobileMenu()">☰</button>
        </div>
        <!-- Menú Móvil -->
        <div id="mobileMenu" class="hidden md:hidden bg-slate-800 border-t border-slate-700">
            <a href="#" onclick="navigateTo('home')" class="block px-4 py-3 text-slate-300 hover:bg-slate-700">Inicio</a>
            <a href="#juegos" class="block px-4 py-3 text-slate-300 hover:bg-slate-700">Juegos</a>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main id="app" class="pt-20">
        <!-- Se renderiza dinámicamente -->
    </main>

    <!-- Footer Horizontal -->
    <footer class="bg-slate-900/50 border-t border-slate-700/50 mt-20">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4 text-center md:text-left">
                <!-- Logo y descripción -->
                <div class="flex items-center gap-2">
                    <span class="text-2xl">⚽</span>
                    <div>
                        <h3 class="text-white font-bold text-sm">TRIVIA MUNDIALISTA – Cultural Week 2026</h3>
                        <p class="text-slate-400 text-xs">Una experiencia educativa diseñada para aprender jugando.</p>
                    </div>
                </div>

                <!-- Créditos -->
                <div class="text-slate-400 text-xs">
                    <p class="mb-1">Idea original, diseño y desarrollo:</p>
                    <p class="text-white font-semibold">Ronald Rojas Newball</p>
                    <p class="text-white font-semibold">Chrisayuron</p>
                </div>

                <!-- Copyright -->
                <div class="text-slate-500 text-xs">
                    © 2026 Cultural Week
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/data/games.js"></script>
    <script src="js/components.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
